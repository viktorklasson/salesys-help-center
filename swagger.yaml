openapi: 3.0.3
info:
  title: SaleSys API
  description: |
    REST API for the SaleSys platform. All services expose both public (`/api`) and internal
    private (`/privateapi`) endpoints.

    ## Authentication
    Most endpoints require a Bearer access token in the `Authorization` header:
    ```
    Authorization: Bearer <access-token>
    ```

    ## URL Pattern
    - **Public API:** `/api/{serviceName}/{resource}-v{version}/{path}`
    - **Private API:** `/privateapi/{serviceName}/{resource}-v{version}/{path}`

    ## IDs
    All entity IDs are MongoDB ObjectIds (24-character hex strings), e.g. `64a1b2c3d4e5f6a7b8c9d0e1`.
  version: "1.0.0"
  contact:
    name: SaleSys

servers:
  - url: https://app.salesys.se/api
    description: Production server

security:
  - BearerAuth: []

tags:
  - name: Authentication
    description: Login, MFA, password reset
  - name: Users
    description: User management and profile
  - name: Teams
    description: Team management
  - name: Projects
    description: Project management
  - name: User Roles
    description: Role and rights management
  - name: Access Keys
    description: API key management for system users
  - name: Registration Links
    description: Self-registration link management
  - name: Contacts
    description: Contact management
  - name: Contact Fields
    description: Custom contact field definitions
  - name: Contact Tags
    description: Contact tag/label management
  - name: Contact Updates
    description: Audit trail for contact changes
  - name: Exclude Lists
    description: Opt-out and exclusion list management
  - name: Orders
    description: Order management (v1 deprecated, use v2/v3)
  - name: Offers
    description: Offer/quote management
  - name: Products
    description: Product catalog management
  - name: Calendar Events
    description: Calendar and scheduling
  - name: Events
    description: System event log
  - name: Webhooks
    description: Outgoing webhook configuration

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    ObjectId:
      type: string
      pattern: '^[a-f0-9]{24}$'
      example: "64a1b2c3d4e5f6a7b8c9d0e1"

    Error:
      type: object
      properties:
        message:
          type: string
        type:
          type: string
        status:
          type: integer
        extra:
          type: object

    # ─── User Models ────────────────────────────────────────────────────────────

    UserType:
      type: string
      enum: [standard, admin, systemUser, privateUser]

    User:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        type:
          $ref: '#/components/schemas/UserType'
        fullName:
          type: string
          minLength: 2
          maxLength: 50
        username:
          type: string
          minLength: 2
        alias:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        teamId:
          $ref: '#/components/schemas/ObjectId'
        supervisedTeamIds:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
        roleIds:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
        organizationId:
          $ref: '#/components/schemas/ObjectId'
        rights:
          type: array
          items:
            type: string
        features:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        suspended:
          type: boolean
        identityNumber:
          type: string

    UserCreate:
      type: object
      required: [type, fullName, username]
      properties:
        type:
          $ref: '#/components/schemas/UserType'
        fullName:
          type: string
          minLength: 2
          maxLength: 50
        username:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        phone:
          type: string
        teamId:
          $ref: '#/components/schemas/ObjectId'

    UserUpdate:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        teamId:
          $ref: '#/components/schemas/ObjectId'
        preferences:
          $ref: '#/components/schemas/UserPreferences'

    UserPreferences:
      type: object
      properties:
        includeVatInSum:
          type: boolean
        offerDefaultEmailMessage:
          type: string
        offerDefaultEmailSubject:
          type: string
        offerDefaultSmsMessage:
          type: string
        callConnectNotificationEnabled:
          type: boolean
        callerPhoneNumbers:
          type: array
          items:
            type: string
        calendarCallbackEnabled:
          type: boolean

    Team:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        color:
          type: string
          description: Hex color, 2-8 chars
        rights:
          type: array
          items:
            type: string
        isLocked:
          type: boolean
        calendarAccess:
          type: array
          items:
            $ref: '#/components/schemas/TeamCalendarAccess'
        reference:
          type: object

    TeamCalendarAccess:
      type: object
      properties:
        teamId:
          $ref: '#/components/schemas/ObjectId'
        readOnly:
          type: boolean

    Project:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
        iconName:
          type: string
        teamIds:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
        organizationId:
          $ref: '#/components/schemas/ObjectId'
        themeId:
          type: string
        defaultOrderProductIds:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
        reference:
          type: object

    UserRole:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        rights:
          type: array
          items:
            type: string
        calendarAccess:
          type: array
          items:
            $ref: '#/components/schemas/TeamCalendarAccess'
        features:
          type: array
          items:
            type: string

    Organization:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        identityNumber:
          type: string
        address:
          type: string
        postalCode:
          type: string
        city:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        website:
          type: string
        smsSenderId:
          type: string
        createdAt:
          type: string
          format: date-time

    AccessKey:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        userId:
          $ref: '#/components/schemas/ObjectId'
        description:
          type: string
        prefix:
          type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
        isTemporary:
          type: boolean

    RegistrationLink:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        longId:
          type: string
          description: URL-safe identifier used in the registration link URL
        teamId:
          $ref: '#/components/schemas/ObjectId'
        description:
          type: string

    # ─── Contact Models ──────────────────────────────────────────────────────────

    ContactFieldReference:
      type: object
      required: [fieldId, value]
      properties:
        fieldId:
          $ref: '#/components/schemas/ObjectId'
        value:
          type: string

    Contact:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        serialId:
          type: integer
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ContactFieldReference'
        tagIds:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        projectId:
          $ref: '#/components/schemas/ObjectId'
        date:
          type: string
          format: date-time
        callIds:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'

    ContactCreate:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ContactFieldReference'
        tagIds:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
        projectId:
          $ref: '#/components/schemas/ObjectId'

    ContactUpdate:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ContactFieldReference'
          nullable: true
        tagIds:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
          nullable: true
        callIds:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
          nullable: true

    Comment:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        message:
          type: string
        userId:
          $ref: '#/components/schemas/ObjectId'
        date:
          type: string
          format: date-time

    ContactFieldType:
      type: string
      enum: [plain, date, numeric, phoneNumber]

    ContactField:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        label:
          type: string
          maxLength: 100
        type:
          $ref: '#/components/schemas/ContactFieldType'
        projectIds:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
          nullable: true

    ContactTag:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        color:
          type: string
        position:
          type: integer

    ExcludeList:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        isGlobal:
          type: boolean

    ExcludeListString:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        listId:
          $ref: '#/components/schemas/ObjectId'
        value:
          type: string
        reference:
          type: object

    ExcludeListContact:
      type: object
      properties:
        contactId:
          $ref: '#/components/schemas/ObjectId'
        listIds:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'

    EntityOrdering:
      type: object
      required: [ordering]
      properties:
        ordering:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'

    # ─── Order Models ────────────────────────────────────────────────────────────

    OrderFieldReference:
      type: object
      required: [fieldId, value]
      properties:
        fieldId:
          $ref: '#/components/schemas/ObjectId'
        value:
          type: string

    OrderProductReference:
      type: object
      properties:
        productId:
          $ref: '#/components/schemas/ObjectId'
        quantity:
          type: number
        price:
          type: number
        salaryBasis:
          type: number
        vat:
          type: number

    AttachedFile:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        type:
          type: string
        url:
          type: string

    OrderV3:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        serialId:
          type: integer
        userId:
          $ref: '#/components/schemas/ObjectId'
        organizationId:
          $ref: '#/components/schemas/ObjectId'
        projectId:
          $ref: '#/components/schemas/ObjectId'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/OrderFieldReference'
        products:
          type: array
          items:
            $ref: '#/components/schemas/OrderProductReference'
        tagIds:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
        businessDate:
          type: string
          format: date-time
          nullable: true
        files:
          type: array
          items:
            $ref: '#/components/schemas/AttachedFile'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        isTest:
          type: boolean
        date:
          type: string
          format: date-time

    OrderCreateV2:
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/ObjectId'
        projectId:
          $ref: '#/components/schemas/ObjectId'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/OrderFieldReference'
        products:
          type: array
          items:
            $ref: '#/components/schemas/OrderProductReference'
        tagIds:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
        businessDate:
          type: string
          format: date-time

    OrderUpdateV2:
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/ObjectId'
        businessDate:
          type: string
          format: date-time
          nullable: true
        replaceFields:
          type: array
          items:
            $ref: '#/components/schemas/OrderFieldReference'
        addFields:
          type: array
          items:
            $ref: '#/components/schemas/OrderFieldReference'
        removeFieldIds:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
        products:
          type: array
          items:
            $ref: '#/components/schemas/OrderProductReference'
        tagIds:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'

    # ─── Offer Models ────────────────────────────────────────────────────────────

    OfferStatus:
      type: string
      enum: [pending, signed, declined, cancelled, expired]

    OfferV2:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        serialId:
          type: integer
        publicId:
          type: string
          nullable: true
          description: Short ID used in the public offer URL
        status:
          $ref: '#/components/schemas/OfferStatus'
        userId:
          $ref: '#/components/schemas/ObjectId'
        organizationId:
          $ref: '#/components/schemas/ObjectId'
        templateId:
          $ref: '#/components/schemas/ObjectId'
        recipient:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
              format: email
            phone:
              type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/OrderFieldReference'
        products:
          type: array
          items:
            $ref: '#/components/schemas/OrderProductReference'
        files:
          type: array
          items:
            $ref: '#/components/schemas/AttachedFile'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        expireAt:
          type: string
          format: date-time
          nullable: true
        isTest:
          type: boolean
        date:
          type: string
          format: date-time

    # ─── Product Models ──────────────────────────────────────────────────────────

    Product:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          nullable: true
        vat:
          type: number
          nullable: true
        imageUrl:
          type: string
          nullable: true
        categoryId:
          $ref: '#/components/schemas/ObjectId'
        position:
          type: integer
        fields:
          type: array
          items:
            $ref: '#/components/schemas/OrderFieldReference'

    # ─── Calendar Models ─────────────────────────────────────────────────────────

    CalendarEvent:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        userId:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
        description:
          type: string
          nullable: true
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        color:
          type: string
          nullable: true
        isRecurring:
          type: boolean
        files:
          type: array
          items:
            $ref: '#/components/schemas/AttachedFile'
        projectId:
          $ref: '#/components/schemas/ObjectId'
        orderId:
          $ref: '#/components/schemas/ObjectId'
          nullable: true
        contactId:
          $ref: '#/components/schemas/ObjectId'
          nullable: true

    CalendarEventCreate:
      type: object
      required: [title, startAt, endAt]
      properties:
        title:
          type: string
        description:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        color:
          type: string
        projectId:
          $ref: '#/components/schemas/ObjectId'
        orderId:
          $ref: '#/components/schemas/ObjectId'
        contactId:
          $ref: '#/components/schemas/ObjectId'

    CalendarEventUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        color:
          type: string
          nullable: true
        projectId:
          $ref: '#/components/schemas/ObjectId'

    # ─── Webhook Models ───────────────────────────────────────────────────────────

    WebhookEventReference:
      type: object
      required: [name]
      properties:
        name:
          type: string
          enum:
            - calendar-event-updated-v1
            - order-created-v1
            - order-updated-v1

    Webhook:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventReference'
        description:
          type: string
          nullable: true

    WebhookCreate:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventReference'
        description:
          type: string

paths:

  # ═══════════════════════════════════════════════════════════════════════════════
  # AUTHENTICATION  —  service: users
  # ═══════════════════════════════════════════════════════════════════════════════

  /api/users/login-v1:
    post:
      tags: [Authentication]
      summary: Login with username and password
      description: |
        Authenticates a user and returns credentials via cookies.
        If multi-factor authentication is required, a `400` response is returned
        with a `mfaToken` cookie set.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usernameOrEmail, password]
              properties:
                usernameOrEmail:
                  type: string
                  description: Username or email address
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful. Credentials set as cookies.
        "400":
          description: Invalid credentials or MFA required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/login-v1/mfa:
    post:
      tags: [Authentication]
      summary: Verify MFA code
      description: Verifies a 6-digit MFA code using the `s2_mfatoken` cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfaCode]
              properties:
                mfaCode:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        "200":
          description: MFA verified. Credentials set as cookies.
        "400":
          description: Invalid or expired MFA code

  /api/users/login-v1/mfa/sms:
    post:
      tags: [Authentication]
      summary: Send MFA code via SMS
      description: Sends a new MFA code to the user's registered phone number.
      security: []
      responses:
        "200":
          description: SMS sent successfully

  /api/users/password-reset-v1:
    get:
      tags: [Authentication]
      summary: Get user info by password reset token
      description: Returns basic user information for the given password reset token.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User info
          content:
            application/json:
              schema:
                type: object
                properties:
                  fullName:
                    type: string
                  username:
                    type: string
    post:
      tags: [Authentication]
      summary: Reset password using token
      description: Resets the password for the user authenticated by the `Authorization` header token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword:
                  type: string
      responses:
        "200":
          description: Password reset successfully

  /api/users/password-reset-v1/request:
    post:
      tags: [Authentication]
      summary: Request a password reset link
      description: Sends a password reset email to the given address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, lastIdentityNumberDigits]
              properties:
                email:
                  type: string
                  format: email
                lastIdentityNumberDigits:
                  type: string
                  minLength: 5
                  maxLength: 5
                  description: Last 5 digits of the user's identity/personal number
      responses:
        "200":
          description: Reset email sent if user exists

  # ═══════════════════════════════════════════════════════════════════════════════
  # USERS  —  service: users
  # ═══════════════════════════════════════════════════════════════════════════════

  /api/users/me-v1:
    get:
      tags: [Users]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/users/me-v1/identifiable:
    get:
      tags: [Users]
      summary: Get identifiable current user (minimal)
      responses:
        "200":
          description: Identifiable user (id, type, organizationId)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    $ref: '#/components/schemas/ObjectId'
                  type:
                    $ref: '#/components/schemas/UserType'
                  organizationId:
                    $ref: '#/components/schemas/ObjectId'

  /api/users/me-v1/rightful:
    get:
      tags: [Users]
      summary: Get current user with rights
      responses:
        "200":
          description: User with rights, teamId, roleIds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/users/me-v1/extended:
    get:
      tags: [Users]
      summary: Get current user with organization details
      responses:
        "200":
          description: User including organization info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/User'
                  - type: object
                    properties:
                      organization:
                        $ref: '#/components/schemas/Organization'

  /api/users/users-v1:
    get:
      tags: [Users]
      summary: List users
      parameters:
        - name: ids
          in: query
          schema:
            type: string
            description: Comma-separated ObjectIds
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/UserType'
        - name: active
          in: query
          schema:
            type: boolean
        - name: suspended
          in: query
          schema:
            type: boolean
        - name: organizationIds
          in: query
          schema:
            type: string
            description: Comma-separated ObjectIds (admin only)
        - name: count
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
        - name: reference
          in: query
          schema:
            type: string
            description: JSON encoded filter object
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags: [Users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    $ref: '#/components/schemas/ObjectId'

