# Production stack: app + MongoDB. nginx on the server proxies the domain to the app on
# 127.0.0.1:3000 and handles HTTPS.
# Variables come from .env.production (see .env.example). DATABASE_URL must use the host `mongo`.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  app:
    image: adamsalesys/salesys-help-center-app:latest
    restart: unless-stopped
    env_file: .env.production
    # Only reachable from this machine; nginx in front of it handles public traffic
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      # Uploaded files from the Media collection
      - media:/app/media
    logging: *logging

  mongo:
    # Pinned major version: existing data was created by 9.x, and mongod can't open data from a newer major
    image: mongo:9
    restart: unless-stopped
    # Only reachable from this machine (e.g. `npm run dev` locally, or an SSH tunnel), never publicly
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  # One-off: load seed/content.json + seed/media into the database.
  #   docker compose run --rm seed                      (only into an empty database)
  #   docker compose run --rm -e SEED_FORCE=true seed   (replace all content)
  seed:
    profiles: [tools]
    build:
      context: .
      target: seed
    env_file: .env.production
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - media:/app/media

volumes:
  data:
  media:
