services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mongo
    volumes:
      - media:/app/media

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - data:/data/db

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data

volumes:
  data:
  media:
  caddy_data:
