                  type: number
                categoryId:
                  $ref: '#/components/schemas/ObjectId'
                fields:
                  type: array
                  items:
                    $ref: '#/components/schemas/OrderFieldReference'
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  recordId:
                    $ref: '#/components/schemas/ObjectId'
                    nullable: true
    delete:
      tags: [Products]
      summary: Delete a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        "200":
          description: Deleted

  /api/products/products-v1/{productId}/image:
    put:
      tags: [Products]
      summary: Update a product's image
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Image updated

