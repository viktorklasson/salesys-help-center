      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: eventId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: File attached
          content:
            application/json:
              schema:
                type: object
                properties:
                  file:
                    $ref: '#/components/schemas/AttachedFile'

  /api/calendar/calendar-events-v1/{userId}/{eventId}/files/{fileId}:
    delete:
      tags: [Calendar Events]
      summary: Delete a file from a calendar event
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: eventId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: fileId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        "200":
          description: Deleted

  # ═══════════════════════════════════════════════════════════════════════════════
  # EVENTS  —  service: events
  # ═══════════════════════════════════════════════════════════════════════════════

  /api/events/events-v1:
    get:
      tags: [Events]
      summary: List system events (admin only)
      parameters:
        - name: search
          in: query
          schema:
            type: string
            description: Free text search (event name, topic, order serial ID)
        - name: namePrefixes
          in: query
          schema:
            type: string
            description: Comma-separated event name prefixes
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: count
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [ascending, descending]
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      $ref: '#/components/schemas/ObjectId'
                    date:
                      type: string
                      format: date-time
                    name:
                      type: string
                    topic:
                      type: string
                    data:
                      type: object

  # ═══════════════════════════════════════════════════════════════════════════════
  # WEBHOOKS  —  service: events
  # ═══════════════════════════════════════════════════════════════════════════════

  /api/events/webhooks-v1:
    get:
      tags: [Webhooks]
      summary: List webhooks (admin only)
      responses:
        "200":
          description: List of webhooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
    post:
      tags: [Webhooks]
      summary: Create a webhook (admin only)
      description: |
        Creates a new outgoing webhook. Supported event names:
        - `calendar-event-updated-v1`
        - `order-created-v1`
        - `order-updated-v1`

        A URL can only be registered once per organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreate'
      responses:
        "200":
          description: Webhook created
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhookId:
                    $ref: '#/components/schemas/ObjectId'

  /api/events/webhooks-v1/{webhookId}:
    get:
      tags: [Webhooks]
      summary: Get a webhook by ID (admin only)
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        "200":
          description: Webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        "404":
          description: Not found
    put:
      tags: [Webhooks]
      summary: Update a webhook (admin only)
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  items:
                    $ref: '#/components/schemas/WebhookEventReference'
                description:
                  type: string
      responses:
        "200":
          description: Updated
        "404":
          description: Not found
