  /api/calendar/calendar-events-v2:
    get:
      tags: [Calendar Events]
      summary: List calendar events (v2 — current)
      parameters:
        - name: userIds
          in: query
          schema:
            type: string
            description: Comma-separated user ObjectIds
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: projectIds
          in: query
          schema:
            type: string
        - name: count
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEvent'

  /api/calendar/calendar-events-v2/{eventId}:
    get:
      tags: [Calendar Events]
      summary: Get a calendar event by ID (v2)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        "200":
          description: Calendar event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEvent'
        "404":
          description: Not found
    put:
      tags: [Calendar Events]
      summary: Update a calendar event (v2)
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarEventUpdate'
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  recordId:
                    $ref: '#/components/schemas/ObjectId'
                    nullable: true

  /api/calendar/calendar-events-v1/{userId}:
    get:
      tags: [Calendar Events]
      summary: List events for a user (v1 — deprecated, use v2)
      deprecated: true
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEvent'
    post:
      tags: [Calendar Events]
      summary: Create a calendar event for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarEventCreate'
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId:
                    $ref: '#/components/schemas/ObjectId'

  /api/calendar/calendar-events-v1/{userId}/reminder:
    get:
      tags: [Calendar Events]
      summary: Get the reminded (upcoming) event for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: consume
          in: query
          schema:
            type: boolean
            description: If true, marks the reminder as consumed
      responses:
        "200":
          description: Reminded event or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CalendarEvent'
                  - type: 'null'

  /api/calendar/calendar-events-v1/{userId}/{eventId}:
    put:
      tags: [Calendar Events]
      summary: Update an event (v1 — deprecated)
      deprecated: true
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: eventId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarEventUpdate'
      responses:
        "200":
          description: Updated

  /api/calendar/calendar-events-v1/{userId}/{eventId}/{occurrence}:
    delete:
      tags: [Calendar Events]
      summary: Delete an event or occurrence
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: eventId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: occurrence
          in: path
          required: false
          schema:
            type: string
            format: date-time
            description: ISO8601 occurrence date for recurring events
        - name: deleteAll
          in: query
          schema:
            type: boolean
        - name: deleteFollowing
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Deleted

  /api/calendar/calendar-events-v1/{userId}/{eventId}/files:
    post:
